<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Surpresa</title>
<meta name="description" content="Um cantinho só dela.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='26'%3E%F0%9F%A4%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg-1: #fbeef0;
    --bg-2: #f6dfe6;
    --bg-3: #fef8f2;
    --surface: rgba(255,255,255,0.72);
    --surface-solid: #fffaf8;
    --ink: #3d1f26;
    --ink-soft: #86525c;
    --rose: #d9607c;
    --rose-deep: #ab3a58;
    --rose-bright: #ef95a9;
    --gold: #cf9d5c;
    --line: rgba(171,58,88,0.16);
    --shadow: rgba(105,30,46,0.20);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-1: #200f16;
      --bg-2: #2c141d;
      --bg-3: #170b10;
      --surface: rgba(45,20,28,0.62);
      --surface-solid: #2a1620;
      --ink: #f8e6e6;
      --ink-soft: #d8a3ae;
      --rose: #ee92a6;
      --rose-deep: #f6b3c0;
      --rose-bright: #ffc4cf;
      --gold: #e6c084;
      --line: rgba(238,146,166,0.22);
      --shadow: rgba(0,0,0,0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg-1: #200f16;
    --bg-2: #2c141d;
    --bg-3: #170b10;
    --surface: rgba(45,20,28,0.62);
    --surface-solid: #2a1620;
    --ink: #f8e6e6;
    --ink-soft: #d8a3ae;
    --rose: #ee92a6;
    --rose-deep: #f6b3c0;
    --rose-bright: #ffc4cf;
    --gold: #e6c084;
    --line: rgba(238,146,166,0.22);
    --shadow: rgba(0,0,0,0.55);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    color:var(--ink);
    font-family:'Cormorant Garamond', Georgia, serif;
    background:
      radial-gradient(60% 45% at 15% -5%, var(--bg-2), transparent 60%),
      radial-gradient(55% 40% at 90% 8%, var(--bg-3), transparent 55%),
      radial-gradient(70% 60% at 50% 115%, var(--bg-2), transparent 60%),
      var(--bg-1);
    background-attachment: fixed;
    overflow-x:hidden;
    padding-inline:16px;
  }

  canvas#field{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }

  /* ---------- envelope intro ---------- */
  #envelope{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(60% 60% at 50% 40%, var(--bg-2), var(--bg-1));
    transition: opacity .8s ease, visibility .8s ease;
  }
  #envelope.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .env-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    cursor:pointer;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
  }
  .env-icon{
    width:88px;
    height:64px;
    position:relative;
    filter: drop-shadow(0 12px 22px var(--shadow));
  }
  .env-icon svg{ width:100%; height:100%; display:block; }
  .env-flap{
    transform-origin: 50% 0%;
    animation: flap-idle 3.2s ease-in-out infinite;
  }
  @keyframes flap-idle{
    0%,100%{ transform: rotateX(0deg); }
    50%{ transform: rotateX(-8deg); }
  }
  .env-label{
    font-family:'Poppins', sans-serif;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color: var(--ink-soft);
  }
  .env-title{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;
    font-size: clamp(1.4rem, 5vw, 1.8rem);
    color: var(--rose-deep);
    text-align:center;
  }
  @media (prefers-reduced-motion: reduce){
    .env-flap{ animation:none; }
  }

  /* ---------- main stage ---------- */
  .stage{
    position:relative;
    z-index:1;
    max-width:560px;
    margin:0 auto;
    padding-block: 56px 72px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    opacity:0;
    transform: translateY(14px);
  }
  .stage.reveal{
    animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rise{
    to{ opacity:1; transform:none; }
  }

  .ornament{
    width:120px;
    height:auto;
    color: var(--gold);
    opacity:0.85;
    margin-bottom:18px;
  }

  .eyebrow{
    font-family:'Poppins', sans-serif;
    font-size:11px;
    letter-spacing:0.34em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 14px;
  }

  h1{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-style:italic;
    font-size:clamp(2.6rem, 11vw, 4.2rem);
    line-height:1;
    margin:0 0 6px;
    text-wrap:balance;
    background: linear-gradient(100deg, var(--rose-deep), var(--rose) 45%, var(--gold) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:0.01em;
  }
  h1 .letter{
    display:inline-block;
    opacity:0;
    transform: translateY(0.35em) rotate(4deg);
    animation: letter-in .6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes letter-in{
    to{ opacity:1; transform:none; }
  }

  .subtitle{
    font-size: clamp(1rem, 3.6vw, 1.15rem);
    color: var(--ink-soft);
    margin: 0 0 34px;
    font-style: italic;
  }

  .couple{
    width: min(62vw, 210px);
    height:auto;
    margin: 6px 0 20px;
    filter: drop-shadow(0 12px 24px var(--shadow));
    overflow:visible;
  }
  .hug-group{
    animation: hug-sway 3.6s ease-in-out infinite;
    transform-origin: 110px 190px;
  }
  @keyframes hug-sway{
    0%,100%{ transform: rotate(-1.4deg); }
    50%{ transform: rotate(1.4deg); }
  }
  .mini-heart{
    animation: heart-float 3s ease-in-out infinite;
    opacity:0;
  }
  .mini-heart.h1{ animation-delay: 0s; }
  .mini-heart.h2{ animation-delay: .8s; }
  .mini-heart.h3{ animation-delay: 1.6s; }
  @keyframes heart-float{
    0%{ transform: translateY(6px) scale(0.85); opacity:0; }
    20%{ opacity:1; }
    70%{ opacity:0.9; }
    100%{ transform: translateY(-14px) scale(1.05); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .hug-group{ animation:none; }
    .mini-heart{ animation:none; opacity:0.85; }
  }

  .frame-wrap{
    position:relative;
    width:min(58vw, 250px);
    aspect-ratio:1;
    margin-bottom: 12px;
  }
  .glow{
    position:absolute;
    inset:-20%;
    border-radius:50%;
    background: conic-gradient(from 0deg, var(--rose), var(--gold), var(--rose-bright), var(--rose-deep), var(--rose));
    filter: blur(20px);
    opacity:0.6;
    animation: spin 16s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .ring{
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border: 1px solid var(--line);
  }

  .frame{
    position:absolute;
    inset:0;
    border-radius:50%;
    overflow:hidden;
    background: var(--surface-solid);
    border: 4px solid var(--surface-solid);
    box-shadow: 0 20px 48px var(--shadow), 0 0 0 1px var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .frame .placeholder{
    font-family:'Poppins', sans-serif;
    font-size:12px;
    color: var(--ink-soft);
    padding: 12px;
    line-height:1.6;
  }
  .frame input[type="file"]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }
  .edit-tag{
    font-family:'Poppins', sans-serif;
    font-size:10px;
    letter-spacing:0.05em;
    color: var(--ink-soft);
    margin: 12px 0 36px;
    opacity:0.75;
  }

  .card{
    position:relative;
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 34px 28px;
    width:100%;
    box-shadow: 0 24px 50px var(--shadow);
    min-height: 178px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    padding:1px;
    border-radius:22px;
    background: linear-gradient(120deg, var(--rose), transparent 30%, transparent 70%, var(--gold));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity:0.5;
    pointer-events:none;
  }
  .quote-mark{
    font-family:'Playfair Display', serif;
    font-size:2.1rem;
    color:var(--gold);
    line-height:1;
    opacity:0.75;
  }
  .phrase{
    font-size: clamp(1.2rem, 5vw, 1.55rem);
    font-style:italic;
    line-height:1.5;
    color:var(--ink);
    min-height:3.4em;
    display:flex;
    align-items:center;
    justify-content:center;
    text-wrap:balance;
    transition: opacity .35s ease, transform .35s ease;
  }
  .dots{
    display:flex;
    gap:7px;
    margin-top:2px;
  }
  .dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background: var(--line);
    transition: background .3s ease, transform .3s ease;
  }
  .dots span.active{
    background: var(--rose);
    transform: scale(1.35);
  }

  .footer{
    margin-top: 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-family:'Poppins', sans-serif;
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color: var(--ink-soft);
    opacity:0.75;
  }
  .footer .date{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    letter-spacing:0;
    text-transform:none;
    font-size:15px;
    color: var(--rose-deep);
  }
  .heart-mini{
    width:14px;
    height:14px;
    color: var(--rose);
    opacity:0.8;
  }

  @media (prefers-reduced-motion: reduce){
    .glow{ animation: none; }
    .stage{ opacity:1; transform:none; animation:none; }
    h1 .letter{ opacity:1; transform:none; animation:none; }
  }
</style>
</head>
<body>

<canvas id="field"></canvas>

<div id="envelope">
  <div class="env-card" id="envCard" role="button" tabindex="0" aria-label="Abrir surpresa">
    <div class="env-icon">
      <svg viewBox="0 0 100 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="14" width="96" height="56" rx="6" fill="var(--surface-solid)" stroke="var(--rose)" stroke-width="2"/>
        <path d="M4 16 L50 50 L96 16" stroke="var(--rose)" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <g class="env-flap">
          <path d="M2 20 C2 16 5 13 9 13 L91 13 C95 13 98 16 98 20 L50 46 Z" fill="var(--rose-bright)" stroke="var(--rose)" stroke-width="2" stroke-linejoin="round"/>
        </g>
        <path d="M50 34 c-6 -8 -18 -6 -18 3 c0 8 18 18 18 18 s18 -10 18 -18 c0 -9 -12 -11 -18 -3 z" fill="var(--rose-deep)"/>
      </svg>
    </div>
    <p class="env-title">Uma surpresa para você</p>
    <p class="env-label">toque para abrir</p>
  </div>
</div>

<main class="stage" id="stage">
  <svg class="ornament" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M0 20 C40 20 40 5 70 5 C90 5 90 20 100 20 C110 20 110 5 130 5 C160 5 160 20 200 20" stroke="currentColor" stroke-width="1.4"/>
    <path d="M100 12 c-4 -5 -12 -4 -12 2 c0 5 12 11 12 11 s12 -6 12 -11 c0 -6 -8 -7 -12 -2 z" fill="currentColor"/>
  </svg>

  <p class="eyebrow">Feito com carinho para</p>
  <h1 id="title"></h1>
  <p class="subtitle">um cantinho pequeno, só seu.</p>

  <svg class="couple" viewBox="0 0 220 190" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="skinBoy" cx="38%" cy="28%" r="80%">
        <stop offset="0%" stop-color="#ffdcb8"/>
        <stop offset="100%" stop-color="#eeb488"/>
      </radialGradient>
      <radialGradient id="skinGirl" cx="38%" cy="28%" r="80%">
        <stop offset="0%" stop-color="#ffe2c8"/>
        <stop offset="100%" stop-color="#f2bf98"/>
      </radialGradient>
    </defs>

    <!-- floating hearts -->
    <path class="mini-heart h1" d="M108 10 c-2.4 -4.4 -9.6 -3.9 -9.6 1.4 c0 4.6 9.6 10.2 9.6 10.2 s9.6 -5.6 9.6 -10.2 c0 -5.3 -7.2 -5.8 -9.6 -1.4 z" fill="var(--gold)"/>
    <path class="mini-heart h2" d="M42 34 c-1.8 -3.4 -7.4 -3 -7.4 1.1 c0 3.5 7.4 7.9 7.4 7.9 s7.4 -4.4 7.4 -7.9 c0 -4.1 -5.6 -4.5 -7.4 -1.1 z" fill="var(--rose)" opacity="0.85"/>
    <path class="mini-heart h3" d="M186 40 c-1.6 -3 -6.6 -2.7 -6.6 1 c0 3.1 6.6 7 6.6 7 s6.6 -3.9 6.6 -7 c0 -3.7 -5 -4 -6.6 -1 z" fill="var(--gold)" opacity="0.8"/>

    <g class="hug-group">
      <!-- boy body (behind, turned slightly away) -->
      <path d="M22 190 C22 144 40 118 72 118 C100 118 116 140 118 168 L118 190 Z" fill="#4d3a52"/>
      <!-- boy hair back -->
      <path d="M40 100 C36 74 46 48 76 46 C104 45 116 66 111 90 C104 78 92 72 80 74 C66 77 54 86 46 98 C44 99 42 100 40 100 Z" fill="#33221c"/>
      <!-- boy head (tilted toward her) -->
      <g transform="rotate(-8 78 78)">
        <circle cx="78" cy="78" r="24" fill="url(#skinBoy)"/>
        <ellipse cx="55" cy="82" rx="4.2" ry="5.6" fill="url(#skinBoy)"/>
        <path d="M55 70 C56 52 66 41 79 41 C94 41 103 52 103 66 C97 58 88 55 80 57 C71 59 63 60 56 66 C55.5 67.3 55.2 68.6 55 70 Z" fill="#33221c"/>
        <path d="M64 80 q6 4.5 12 0" stroke="#2c1c16" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M63 72 q5 -2.6 10 -1" stroke="#2c1c16" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
        <circle cx="66" cy="88" r="3.8" fill="var(--rose)" opacity="0.35"/>
      </g>

      <!-- boy arm wrapping her back -->
      <path d="M104 122 C122 118 138 126 144 142 C146 150 144 158 138 163 C136 150 130 140 118 136 C112 134 106 130 104 122 Z" fill="#4d3a52"/>

      <!-- girl body (front, hugging in) -->
      <path d="M96 190 C96 148 112 124 140 124 C168 124 186 150 186 190 Z" fill="var(--rose-deep)"/>

      <!-- girl arm wrapping his neck -->
      <path d="M96 128 C82 122 66 126 58 138 C54 145 55 152 60 157 C64 146 72 138 84 135 C90 133 94 131 96 128 Z" fill="var(--rose)"/>

      <!-- girl hair back -->
      <path d="M108 122 C104 92 114 60 146 58 C178 57 190 82 186 110 C184 126 180 138 174 146 C176 128 172 112 164 104 C166 116 160 126 152 128 C155 116 149 104 140 102 C130 100 120 104 114 112 C111 115 109 118 108 122 Z" fill="#3d281e"/>
      <!-- girl head resting on his shoulder -->
      <g transform="rotate(10 138 84)">
        <circle cx="138" cy="84" r="26" fill="url(#skinGirl)"/>
        <ellipse cx="163" cy="88" rx="4.4" ry="6" fill="url(#skinGirl)"/>
        <path d="M112 80 C112 58 126 43 141 43 C158 43 170 56 169 73 C163 63 154 58 144 60 C134 62 124 63 116 70 C114 73 113 76 112 80 Z" fill="#3d281e"/>
        <path d="M166 76 C172 85 172 100 167 112 C163 103 161 92 163 81 Z" fill="#3d281e"/>
        <!-- happy closed eye + smile -->
        <path d="M124 85 q6 -6 12 0" stroke="#33221a" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M122 76 q5 -2.8 10 -1" stroke="#33221a" stroke-width="1.7" stroke-linecap="round" opacity="0.75"/>
        <path d="M126 96 q9 7 18 0" stroke="#33221a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <circle cx="128" cy="98" r="4.6" fill="var(--rose)" opacity="0.42"/>
      </g>
    </g>
  </svg>

  <div class="frame-wrap">
    <div class="glow"></div>
    <div class="ring"></div>
    <div class="frame" id="frame">
      <div class="placeholder" id="placeholder" hidden>toque para<br>adicionar a foto</div>
      <img id="photo" src="foto.jpg" alt="Foto da Ayane">
      <input type="file" accept="image/*" id="fileInput" title="Escolher foto">
    </div>
  </div>
  <p class="edit-tag">toque na foto para trocar · fica salva só neste navegador</p>

  <div class="card">
    <span class="quote-mark">&ldquo;</span>
    <p class="phrase" id="phrase"></p>
    <div class="dots" id="dots"></div>
  </div>

  <div class="footer">
    <svg class="heart-mini" viewBox="0 0 32 29" fill="currentColor"><path d="M16 29 C4 20 0 13 0 8 C0 2 5 0 8 0 C12 0 15 3 16 6 C17 3 20 0 24 0 C27 0 32 2 32 8 C32 13 28 20 16 29 Z"/></svg>
    <span>Este cantinho é seu</span>
    <span class="date" id="today"></span>
  </div>
</main>

<script>
(function(){
  // ---- envelope intro ----
  var envelope = document.getElementById('envelope');
  var envCard = document.getElementById('envCard');
  var stage = document.getElementById('stage');

  function openEnvelope(){
    envelope.classList.add('hidden');
    stage.classList.add('reveal');
  }
  envCard.addEventListener('click', openEnvelope);
  envCard.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openEnvelope(); }
  });

  // ---- animated title letters ----
  var name = "Ayane";
  var titleEl = document.getElementById('title');
  name.split('').forEach(function(ch, i){
    var span = document.createElement('span');
    span.className = 'letter';
    span.style.animationDelay = (0.15 + i * 0.07) + 's';
    span.textContent = ch;
    titleEl.appendChild(span);
  });

  // ---- photo (per-browser, localStorage) ----
  var img = document.getElementById('photo');
  var placeholder = document.getElementById('placeholder');
  var fileInput = document.getElementById('fileInput');
  var STORAGE_KEY = 'ayane_photo_v1';

  function showPhoto(dataUrl){
    img.src = dataUrl;
    img.hidden = false;
    placeholder.hidden = true;
  }

  try{
    var saved = localStorage.getItem(STORAGE_KEY);
    if(saved) showPhoto(saved);
  }catch(e){}

  fileInput.addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var dataUrl = ev.target.result;
      showPhoto(dataUrl);
      try{ localStorage.setItem(STORAGE_KEY, dataUrl); }catch(err){}
    };
    reader.readAsDataURL(file);
  });

  // ---- rotating phrases ----
  var phrases = [
    "Um chocolate, para a pessoa mais doce que eu conheço.",
    "Seu sorriso é o meu horário preferido do dia.",
    "Eu escolheria você em qualquer versão da minha vida."
  ];

  var phraseEl = document.getElementById('phrase');
  var dotsEl = document.getElementById('dots');
  var current = 0;

  phrases.forEach(function(_, i){
    var d = document.createElement('span');
    if(i === 0) d.className = 'active';
    dotsEl.appendChild(d);
  });

  function setPhrase(i){
    phraseEl.style.opacity = 0;
    phraseEl.style.transform = 'translateY(4px)';
    setTimeout(function(){
      phraseEl.textContent = phrases[i];
      phraseEl.style.opacity = 1;
      phraseEl.style.transform = 'none';
    }, 350);
    var dots = dotsEl.children;
    for(var k=0;k<dots.length;k++){ dots[k].className = (k===i) ? 'active' : ''; }
  }
  setPhrase(0);

  setInterval(function(){
    current = (current + 1) % phrases.length;
    setPhrase(current);
  }, 4200);

  // ---- date ----
  try{
    var todayEl = document.getElementById('today');
    var d = new Date();
    var opts = { day:'numeric', month:'long', year:'numeric' };
    todayEl.textContent = d.toLocaleDateString('pt-BR', opts);
  }catch(e){}

  // ---- floating hearts / petals canvas ----
  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, particles = [];
  var N = 30;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function rand(a,b){ return a + Math.random()*(b-a); }

  function makeParticle(){
    return {
      x: rand(0, W),
      y: rand(0, H),
      size: rand(6, 17),
      speed: rand(0.15, 0.5),
      drift: rand(-0.3, 0.3),
      sway: rand(0, Math.PI*2),
      swaySpeed: rand(0.005, 0.02),
      spin: rand(-0.01, 0.01),
      angle: rand(0, Math.PI*2),
      opacity: rand(0.14, 0.42),
      hueGold: Math.random() < 0.25
    };
  }
  for(var i=0;i<N;i++) particles.push(makeParticle());

  function heartPath(cx, cy, size){
    ctx.beginPath();
    var t = size * 0.3;
    ctx.moveTo(cx, cy + t);
    ctx.bezierCurveTo(cx, cy, cx - size/2, cy, cx - size/2, cy + t);
    ctx.bezierCurveTo(cx - size/2, cy + (size+t)/2, cx, cy + (size+t)/1.3, cx, cy + size);
    ctx.bezierCurveTo(cx, cy + (size+t)/1.3, cx + size/2, cy + (size+t)/2, cx + size/2, cy + t);
    ctx.bezierCurveTo(cx + size/2, cy, cx, cy, cx, cy + t);
    ctx.closePath();
  }

  function getToken(name, fallback){
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }
  var roseRGB = getToken('--rose', '#d9607c');
  var goldRGB = getToken('--gold', '#cf9d5c');

  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.hueGold ? goldRGB : roseRGB;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      heartPath(0, -p.size/2, p.size);
      ctx.fill();
      ctx.restore();

      if(!reduceMotion){
        p.sway += p.swaySpeed;
        p.angle += p.spin;
        p.y -= p.speed;
        p.x += p.drift + Math.sin(p.sway) * 0.3;
        if(p.y < -20){ p.y = H + 20; p.x = rand(0, W); }
        if(p.x < -20) p.x = W + 20;
        if(p.x > W + 20) p.x = -20;
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
